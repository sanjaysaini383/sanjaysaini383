<svg width="1500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#001500;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#000d00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>

    <filter id="greenGlow" x="-20%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-60%" y="-60%" width="240%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="orbGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%"   style="stop-color:#aaffaa;stop-opacity:1"/>
      <stop offset="30%"  style="stop-color:#00ff00;stop-opacity:1"/>
      <stop offset="70%"  style="stop-color:#00aa00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#002200;stop-opacity:1"/>
    </radialGradient>

    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   style="stop-color:#00ff00;stop-opacity:0"/>
      <stop offset="30%"  style="stop-color:#00ff00;stop-opacity:0.9"/>
      <stop offset="70%"  style="stop-color:#00ff00;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#00ff00;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="ringGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   style="stop-color:#00ff00;stop-opacity:0"/>
      <stop offset="50%"  style="stop-color:#00ff00;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#00ff00;stop-opacity:0"/>
    </linearGradient>

    <style>
      @keyframes matrixRain {
        0%   { transform: translateY(-60px); opacity: 1;   }
        80%  { opacity: 0.4; }
        100% { transform: translateY(520px); opacity: 0;   }
      }
      @keyframes orbPulse {
        0%, 100% { opacity: 1;    }
        50%       { opacity: 0.82; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }
      @keyframes fadeInUp {
        0%   { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0);    }
      }
      @keyframes scanline {
        0%   { transform: translateY(0px);   opacity: 0.06; }
        50%  { opacity: 0.13; }
        100% { transform: translateY(500px); opacity: 0.06; }
      }
      @keyframes ring1Spin {
        from { transform: rotate(0deg);   }
        to   { transform: rotate(360deg); }
      }
      @keyframes ring2Spin {
        from { transform: rotate(0deg);    }
        to   { transform: rotate(-360deg); }
      }
      @keyframes ring3Spin {
        from { transform: rotate(0deg);   }
        to   { transform: rotate(360deg); }
      }

      .col1 { animation: matrixRain 3.8s linear infinite;        }
      .col2 { animation: matrixRain 5.2s linear infinite 1.3s;   }
      .col3 { animation: matrixRain 4.5s linear infinite 0.7s;   }
      .col4 { animation: matrixRain 6.1s linear infinite 2.1s;   }
      .col5 { animation: matrixRain 4.0s linear infinite 2.8s;   }
      .col6 { animation: matrixRain 5.7s linear infinite 0.4s;   }

      .orb  { animation: orbPulse  3.2s ease-in-out infinite;    }
      .cur  { animation: blink     1.0s step-end infinite;       }
      .scan { animation: scanline  4.5s linear infinite;         }

      .t1   { animation: fadeInUp  0.8s ease-out 0.2s both; }
      .t2   { animation: fadeInUp  0.8s ease-out 0.5s both; }
      .t3   { animation: fadeInUp  0.8s ease-out 0.8s both; }
      .t4   { animation: fadeInUp  0.8s ease-out 1.1s both; }
      .t5   { animation: fadeInUp  0.8s ease-out 1.4s both; }
      .t6   { animation: fadeInUp  0.8s ease-out 1.7s both; }

      /* Saturn rings spin around orb center (760, 250) */
      .ring1wrap {
        transform-origin: 760px 250px;
        animation: ring1Spin 5s linear infinite;
      }
      .ring2wrap {
        transform-origin: 760px 250px;
        animation: ring2Spin 8s linear infinite;
      }
      .ring3wrap {
        transform-origin: 760px 250px;
        animation: ring3Spin 12s linear infinite;
      }
    </style>
  </defs>

  <!-- ══════════ BACKGROUND ══════════ -->
  <rect width="1100" height="500" fill="url(#bgGrad)" rx="14"/>

  <!-- Scanline -->
  <rect class="scan" x="0" y="0" width="1200" height="3"
        fill="#00ff00" rx="1"/>

  <!-- Outer border -->
  <rect width="1100" height="500" fill="none" rx="14"
        stroke="#00ff00" stroke-width="2" stroke-opacity="0.55"/>

  <!-- Inner border -->
  <rect x="6" y="6" width="1088" height="488" fill="none" rx="11"
        stroke="#00ff00" stroke-width="0.8" stroke-opacity="0.15"/>

  <!-- ══════════ MATRIX RAIN — LEFT SIDE ══════════ -->
  <g class="col1">
    <text x="510" y="0"  font-family="monospace" font-size="13" fill="#00ff00" fill-opacity="0.28">0</text>
    <text x="510" y="20" font-family="monospace" font-size="13" fill="#00ff00" fill-opacity="0.22">1</text>
    <text x="510" y="40" font-family="monospace" font-size="13" fill="#00ff00" fill-opacity="0.16">0</text>
    <text x="510" y="60" font-family="monospace" font-size="13" fill="#00ff00" fill-opacity="0.10">1</text>
    <text x="510" y="80" font-family="monospace" font-size="13" fill="#00ff00" fill-opacity="0.05">0</text>
  </g>
  <g class="col2">
    <text x="540" y="0"  font-family="monospace" font-size="13" fill="#00ff00" fill-opacity="0.22">1</text>
    <text x="540" y="20" font-family="monospace" font-size="13" fill="#00ff00" fill-opacity="0.16">0</text>
    <text x="540" y="40" font-family="monospace" font-size="13" fill="#00ff00" fill-opacity="0.10">1</text>
  </g>
  <g class="col3">
    <text x="570" y="0"  font-family="monospace" font-size="13" fill="#00ff00" fill-opacity="0.18">0</text>
    <text x="570" y="20" font-family="monospace" font-size="13" fill="#00ff00" fill-opacity="0.13">1</text>
    <text x="570" y="40" font-family="monospace" font-size="13" fill="#00ff00" fill-opacity="0.08">0</text>
  </g>

  <!-- ══════════ MATRIX RAIN — RIGHT TOP ══════════ -->
  <g class="col4">
    <text x="600" y="0"  font-family="monospace" font-size="11" fill="#00ff00" fill-opacity="0.2">01001000</text>
    <text x="600" y="18" font-family="monospace" font-size="11" fill="#00ff00" fill-opacity="0.15">01000001</text>
    <text x="600" y="36" font-family="monospace" font-size="11" fill="#00ff00" fill-opacity="0.10">01000011</text>
    <text x="600" y="54" font-family="monospace" font-size="11" fill="#00ff00" fill-opacity="0.06">01001011</text>
  </g>

  <!-- ══════════ MATRIX RAIN — RIGHT BOTTOM ══════════ -->
  <g class="col5">
    <text x="600" y="430" font-family="monospace" font-size="11" fill="#00ff00" fill-opacity="0.2">01010011</text>
    <text x="600" y="448" font-family="monospace" font-size="11" fill="#00ff00" fill-opacity="0.15">01000001</text>
    <text x="600" y="466" font-family="monospace" font-size="11" fill="#00ff00" fill-opacity="0.10">01001110</text>
    <text x="600" y="484" font-family="monospace" font-size="11" fill="#00ff00" fill-opacity="0.06">01001010</text>
  </g>
  <g class="col6">
    <text x="750" y="430" font-family="monospace" font-size="11" fill="#00ff00" fill-opacity="0.15">01000001</text>
    <text x="750" y="448" font-family="monospace" font-size="11" fill="#00ff00" fill-opacity="0.10">01010001</text>
    <text x="750" y="466" font-family="monospace" font-size="11" fill="#00ff00" fill-opacity="0.06">10110011</text>
  </g>

  <!-- ══════════ LEFT TEXT CONTENT ══════════ -->

  <!-- Role badge -->
  <g class="t1">
    <rect x="40" y="52" width="230" height="30" rx="4"
          fill="none" stroke="#00ff00" stroke-width="1.5" stroke-opacity="0.9"/>
    <text x="58" y="72" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" letter-spacing="3" filter="url(#textGlow)">FULL STACK ENGINEER</text>
  </g>

  <!-- Main name -->
  <g class="t2">
    <text x="40" y="175" font-family="'Courier New',monospace"
          font-size="70" font-weight="900" fill="#00ff00"
          letter-spacing="-1" filter="url(#greenGlow)">Sanjay Kumar</text>
    <text x="40" y="255" font-family="'Courier New',monospace"
          font-size="70" font-weight="900" fill="#00ff00"
          letter-spacing="-1" filter="url(#greenGlow)">Saini</text>
  </g>

  <!-- Divider line -->
  <line x1="60" y1="278" x2="1140" y2="278"
        stroke="#00ff00" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Description -->
  <g class="t3">
    <text x="40" y="308" font-family="'Courier New',monospace"
          font-size="16" fill="#00ff00" fill-opacity="0.75">Engineering
      <tspan font-weight="bold" fill="#00ff00"
             filter="url(#textGlow)">AI-powered</tspan>
      full-stack systems</text>
    <text x="40" y="332" font-family="'Courier New',monospace"
          font-size="16" fill="#00ff00" fill-opacity="0.75">and
      <tspan font-weight="bold" fill="#00ff00"
             filter="url(#textGlow)">RAG pipelines</tspan>
      · Voice agents · WebSockets</text>
  </g>

  <!-- Tech badges row 1 -->
  <g class="t4">
    <rect x="40"  y="358" width="85"  height="28" rx="4"
          fill="none" stroke="#00ff00" stroke-width="1.5" stroke-opacity="0.9"/>
    <text x="82"  y="377" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" letter-spacing="1">MERN</text>

    <rect x="140" y="358" width="112" height="28" rx="4"
          fill="none" stroke="#00ff00" stroke-width="1.5" stroke-opacity="0.9"/>
    <text x="196" y="377" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" letter-spacing="1">LangChain</text>

    <rect x="268" y="358" width="106" height="28" rx="4"
          fill="none" stroke="#00ff00" stroke-width="1.5" stroke-opacity="0.9"/>
    <text x="321" y="377" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" letter-spacing="1">C++ / DSA</text>
  </g>

  <!-- Tech badges row 2 -->
  <g class="t5">
    <rect x="40"  y="400" width="124" height="28" rx="4"
          fill="none" stroke="#00ff00" stroke-width="1.5" stroke-opacity="0.9"/>
    <text x="102" y="419" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" letter-spacing="1">Docker · AWS</text>

    <rect x="180" y="400" width="130" height="28" rx="4"
          fill="none" stroke="#00ff00" stroke-width="1.5" stroke-opacity="0.9"/>
    <text x="245" y="419" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" letter-spacing="1">WebSockets</text>

    <rect x="326" y="400" width="100" height="28" rx="4"
          fill="none" stroke="#00ff00" stroke-width="1.5" stroke-opacity="0.9"/>
    <text x="376" y="419" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" letter-spacing="1">FastAPI</text>
  </g>

  <!-- Blinking cursor -->
  <g class="t6">
    <rect class="cur" x="40" y="452" width="12" height="3"
          fill="#00ff00" fill-opacity="0.8"/>
  </g>

  <!-- ══════════ SATURN-STYLE SPINNING ORB ══════════ -->
  <!-- Orb center: 760, 250 -->

  <!-- Ambient outer glow -->
  <circle cx="760" cy="250" r="105"
          fill="#00ff00" fill-opacity="0.03"/>
  <circle cx="760" cy="250" r="85"
          fill="#00ff00" fill-opacity="0.04"/>

  <!-- RING 1 — main Saturn ring (tilted ellipse, spinning) -->
  <g class="ring1wrap">
    <!-- Back half of ring (behind orb) -->
    <ellipse cx="760" cy="250" rx="110" ry="26"
             fill="none" stroke="url(#ringGrad)"
             stroke-width="3" stroke-opacity="0.5"
             stroke-dasharray="345 345"
             stroke-dashoffset="0"
             transform="rotate(-20 760 250)"/>
    <!-- Dot on ring 1 -->
    <circle cx="870" cy="250" r="5"
            fill="#00ff00" fill-opacity="0.95"
            filter="url(#orbGlow)"
            transform="rotate(-20 760 250)"/>
  </g>

  <!-- Orb body (drawn AFTER back ring, BEFORE front ring) -->
  <g class="orb">
    <!-- Shadow beneath -->
    <ellipse cx="768" cy="308" rx="48" ry="10"
             fill="#00ff00" fill-opacity="0.07"/>

    <!-- Main orb -->
    <circle cx="760" cy="250" r="62"
            fill="url(#orbGrad)" filter="url(#orbGlow)"/>

    <!-- Orb border ring -->
    <circle cx="760" cy="250" r="62"
            fill="none" stroke="#00ff00"
            stroke-width="2" stroke-opacity="0.65"/>

    <!-- Equator line on orb -->
    <ellipse cx="760" cy="250" rx="62" ry="14"
             fill="none" stroke="#00ff00"
             stroke-width="1" stroke-opacity="0.25"/>

    <!-- Longitude lines -->
    <ellipse cx="760" cy="250" rx="28" ry="62"
             fill="none" stroke="#00ff00"
             stroke-width="0.8" stroke-opacity="0.15"/>
    <ellipse cx="760" cy="250" rx="50" ry="62"
             fill="none" stroke="#00ff00"
             stroke-width="0.8" stroke-opacity="0.10"/>

    <!-- Primary highlight -->
    <ellipse cx="742" cy="232" rx="20" ry="12"
             fill="white" fill-opacity="0.20"
             transform="rotate(-30 742 232)"/>

    <!-- Secondary highlight -->
    <ellipse cx="770" cy="222" rx="9" ry="5"
             fill="white" fill-opacity="0.10"
             transform="rotate(-15 770 222)"/>
  </g>

  <!-- RING 1 — front half (in front of orb) -->
  <g class="ring1wrap">
    <ellipse cx="760" cy="250" rx="110" ry="26"
             fill="none" stroke="url(#ringGrad)"
             stroke-width="3" stroke-opacity="0.9"
             stroke-dasharray="172 518"
             stroke-dashoffset="172"
             transform="rotate(-20 760 250)"/>
  </g>

  <!-- RING 2 — secondary ring (different tilt, reverse spin) -->
  <g class="ring2wrap">
    <ellipse cx="760" cy="250" rx="130" ry="18"
             fill="none" stroke="url(#ringGrad2)"
             stroke-width="1.5" stroke-opacity="0.6"
             transform="rotate(15 760 250)"/>
    <!-- Dot on ring 2 -->
    <circle cx="630" cy="250" r="3.5"
            fill="#00ff00" fill-opacity="0.75"
            filter="url(#orbGlow)"
            transform="rotate(15 760 250)"/>
  </g>

  <!-- RING 3 — outer faint ring (slow spin) -->
  <g class="ring3wrap">
    <ellipse cx="760" cy="250" rx="148" ry="12"
             fill="none" stroke="#00ff00"
             stroke-width="1" stroke-opacity="0.2"
             stroke-dasharray="8,10"
             transform="rotate(-35 760 250)"/>
  </g>

</svg>