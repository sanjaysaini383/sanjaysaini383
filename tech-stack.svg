<svg width="900" height="620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#001500"/>
      <stop offset="60%"  stop-color="#000d00"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes scan2 {
        0%   { transform:translateY(0);    opacity:0.05; }
        50%  { opacity:0.1; }
        100% { transform:translateY(620px); opacity:0.05; }
      }
      @keyframes fadeIn2 { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
      @keyframes badgePulse {
        0%,100% { stroke-opacity:0.7; }
        50%     { stroke-opacity:1.0; }
      }
      .sc2  { animation: scan2 4.5s linear infinite; }
      .g1   { animation: fadeIn2 .5s ease-out .1s  both; }
      .g2   { animation: fadeIn2 .5s ease-out .3s  both; }
      .g3   { animation: fadeIn2 .5s ease-out .5s  both; }
      .g4   { animation: fadeIn2 .5s ease-out .7s  both; }
      .g5   { animation: fadeIn2 .5s ease-out .9s  both; }
      .g6   { animation: fadeIn2 .5s ease-out 1.1s both; }
      .g7   { animation: fadeIn2 .5s ease-out 1.3s both; }
      .g8   { animation: fadeIn2 .5s ease-out 1.5s both; }
      .badge { animation: badgePulse 3s ease-in-out infinite; }
    </style>
  </defs>

