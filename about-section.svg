    <text x="386" y="169" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">,</text>
    <text x="398" y="169" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.75">"TensorFlow"</text>
    <text x="494" y="169" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">,</text>
    <text x="506" y="169" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.75">"Scikit-learn"</text>
    <text x="628" y="169" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">],</text>
  </g>

  <!-- cp -->
  <g class="l6">
    <text x="60" y="192" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.5">cp</text>
    <text x="80" y="192" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">:</text>
    <text x="96" y="192" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.75">"Competitive programming in C++ | DSA enthusiast"</text>
    <text x="572" y="192" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">,</text>
  </g>

  <!-- currently -->
  <g class="l7">
    <text x="60" y="215" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.5">currently</text>
    <text x="152" y="215" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">:</text>
    <text x="168" y="215" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.75">"Building AI-integrated products that ship to real users"</text>
    <text x="706" y="215" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">,</text>
  </g>

  <!-- closing brace -->
  <g class="l8">
    <text x="40" y="238" font-family="'Courier New',monospace" font-size="14"
          fill="#00ff00" fill-opacity="0.45">};</text>
  </g>

  <!-- cursor + status line -->
  <g class="l9">
    <line x1="30" y1="268" x2="870" y2="268"
          stroke="#00ff00" stroke-width="1" stroke-opacity="0.2"/>
    <text x="40" y="288" font-family="'Courier New',monospace" font-size="11"
          fill="#00ff00" fill-opacity="0.35" letter-spacing="2">// STATUS: ONLINE  |  MODE: BUILDER  |  TARGET: PRODUCTION</text>
    <rect class="cur" x="40" y="296" width="10" height="2"
          fill="#00ff00" fill-opacity="0.7"/>
  </g>
