  <g class="l4">
    <text x="60" y="146" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.5">stack</text>
    <text x="112" y="146" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">:</text>
    <text x="128" y="146" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">[</text>
    <text x="140" y="146" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.75">"MERN"</text>
    <text x="196" y="146" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">,</text>
    <text x="208" y="146" font-family="'Courier New',monospace" font-size="13"
