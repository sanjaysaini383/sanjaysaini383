    <text x="564" y="146" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">],</text>
  </g>

  <!-- ai -->
  <g class="l5">
    <text x="60" y="169" font-family="'Courier New',monospace" font-size="13"
