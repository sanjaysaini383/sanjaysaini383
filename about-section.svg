    <text x="108" y="123" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">:</text>
    <text x="124" y="123" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">[</text>
    <text x="136" y="123" font-family="'Courier New',monospace" font-size="13"
