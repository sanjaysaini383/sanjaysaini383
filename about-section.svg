<svg width="900" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#001500"/>
      <stop offset="60%"  stop-color="#000d00"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
      @keyframes scan {
        0%   { transform: translateY(0px);   opacity:0.06; }
        50%  { opacity:0.12; }
        100% { transform: translateY(320px); opacity:0.06; }
      }
      .cur  { animation: blink  1s step-end infinite; }
      .scan { animation: scan   4s linear   infinite; }
      .l1 { animation: fadeIn .6s ease-out .1s both; }
      .l2 { animation: fadeIn .6s ease-out .3s both; }
      .l3 { animation: fadeIn .6s ease-out .5s both; }
      .l4 { animation: fadeIn .6s ease-out .7s both; }
      .l5 { animation: fadeIn .6s ease-out .9s both; }
      .l6 { animation: fadeIn .6s ease-out 1.1s both; }
      .l7 { animation: fadeIn .6s ease-out 1.3s both; }
      .l8 { animation: fadeIn .6s ease-out 1.5s both; }
      .l9 { animation: fadeIn .6s ease-out 1.7s both; }
    </style>
  </defs>

  <!-- BG -->
  <rect width="900" height="320" fill="url(#bg)" rx="12"/>
  <rect class="scan" x="0" y="0" width="900" height="2" fill="#00ff00" rx="1"/>

  <!-- Corner brackets -->
  <!-- <polyline points="16,40 16,16 40,16"   fill="none" stroke="#00ff00" stroke-width="2" stroke-opacity="0.85"/>
  <polyline points="16,280 16,304 40,304" fill="none" stroke="#00ff00" stroke-width="2" stroke-opacity="0.85"/>
  <polyline points="884,40 884,16 860,16"   fill="none" stroke="#00ff00" stroke-width="2" stroke-opacity="0.85"/>
  <polyline points="884,280 884,304 860,304" fill="none" stroke="#00ff00" stroke-width="2" stroke-opacity="0.85"/> -->

  <!-- Section label -->
  <g class="l1">
    <rect x="30" y="22" width="160" height="22" rx="3"
          fill="none" stroke="#00ff00" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="40" y="37" font-family="'Courier New',monospace" font-size="11"
          fill="#00ff00" fill-opacity="0.8" letter-spacing="3">ABOUT.TS</text>
  </g>

  <!-- Code block -->
  <!-- Line 1 -->
  <g class="l1">
    <text x="40" y="75" font-family="'Courier New',monospace" font-size="14"
          fill="#00ff00" fill-opacity="0.45">const</text>
    <text x="102" y="75" font-family="'Courier New',monospace" font-size="14"
          fill="#00ff00" fill-opacity="0.9" filter="url(#glow)">sanjay</text>
    <text x="168" y="75" font-family="'Courier New',monospace" font-size="14"
          fill="#00ff00" fill-opacity="0.45">=  {</text>
  </g>

  <!-- role -->
  <g class="l2">
    <text x="60" y="100" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.5">role</text>
    <text x="100" y="100" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">:</text>
    <text x="116" y="100" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.75">"Full Stack Engineer + AI Systems Builder"</text>
    <text x="546" y="100" font-family="'Courier New',monospace" font-size="13"
          fill="#00ff00" fill-opacity="0.35">,</text>
  </g>

  <!-- focus -->
